name: Scrape Diecast Releases
on:
  schedule:
    # Runs every Monday at 08:00 UTC — adjust as needed
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium --with-deps
      - name: Scrape Pop Race
        run: python scripts/scrape_poprace.py
      - name: Scrape Tarmac Works
        run: python scripts/scrape_tarmac.py
      - name: Scrape Hot Wheels
        run: python scripts/scrape_hotwheels.py
      - name: Scrape Matchbox
        run: python scripts/scrape_matchbox.py
      - name: Scrape MINI GT + Kaido House
        run: python scripts/scrape_minigt.py
      - name: Check for changes
        id: changes
        run: |
          # --quiet only sees tracked-file edits; new JSON feeds are untracked,
          # so stage first, then check the staged diff (catches new + modified).
          git add data/
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "DiecastDrawer Bot"
          git config user.email "bot@diecastdrawer.app"
          git commit -m "chore: auto-update release catalogues $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
